<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ 'assets/style.css' | relative_url }}">
</head>

<!-- Load MathJax -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


<body>
  <div>
    <header padding: 1em 0;">
	<div class="page-container" style="min-height: auto;">
      <h1>{{ site.title }}</h1>
      <nav>
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/research.html' | relative_url }}" class="{% if page.url contains 'research' %}active{% endif %}">Research</a>
        <a href="{{ '/publications.html' | relative_url }}" class="{% if page.url contains 'publications' %}active{% endif %}">Publications</a>
        <a href="{{ '/cv.html' | relative_url }}" class="{% if page.url contains 'cv' %}active{% endif %}">CV</a>
        <a href="{{ '/contact.html' | relative_url }}" class="{% if page.url contains 'contact' %}active{% endif %}">Contact</a>
        <button id="theme-toggle" style="
        position: fixed;
        top: 1em;
        right: 1em;
	padding: 0.5em 1.2em;
	border: none;
	border-radius: 6px;
	background-color: #003366;
	color: #ffffff;
	font-size: 0.9rem;
	cursor: pointer;
	box-shadow: 0 2px 6px rgba(0,0,0,0.15);
	z-index: 1000;
	">
	🌓
        </button>
      </nav>
</div>


    </header>

    <main class="page-container">
      {{ content }}
    </main>

    <footer>
      <div class="footer-grid">
        <div class="footer-left">
          <p><strong>Sagy Ephrati</strong><br></p>
        </div>
        <div class="footer-right">
          <p>
            <a href="https://scholar.google.com/citations?user=JSh4h2YAAAAJ&hl=nl" target="_blank">Google Scholar</a> |
            <a href="https://www.linkedin.com/in/sagy-ephrati-20a6b1108/" target="_blank">LinkedIn</a> |
            <a href="https://github.com/sagye?tab=repositories" target="_blank">GitHub</a>
          </p>
        </div>
      </div>
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Powered by <a href="https://pages.github.com">GitHub Pages</a>.</p>
    </footer>

  </div>

<script>
  const toggle = document.getElementById('theme-toggle');
  const body = document.body;

  // Load previous preference
  if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-mode');
  }

  toggle.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    localStorage.setItem('theme',
      body.classList.contains('dark-mode') ? 'dark' : 'light'
    );
  });
</script>

</body>
</html>
